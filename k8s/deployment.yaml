apiVersion: apps/v1
kind: Deployment
metadata:
  name: gates-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gates-api
  template:
    metadata:
      labels:
        app: gates-api
    spec:
      containers:
        - name: gates-api
          image: gates-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
